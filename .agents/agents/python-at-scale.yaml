version: 1
project: ai-native-vcs
name: python-at-scale
summary: Python is the prototype and orchestration layer; a compiled core may be chosen later.
assessment:
  current_phase: strong for prototyping and AI orchestration
  long_term_core: not the strongest default for performance-critical, high-concurrency internals
recommendation:
  keep_python_for:
    - AI orchestration
    - spec and session workflows
    - validation and experimentation
  evaluate_compiled_runtime_for:
    - storage engine
    - indexing
    - concurrency-bound metadata services
