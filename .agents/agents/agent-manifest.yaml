version: 1
project: ai-native-vcs
agents:
  - id: spec-steward
    name: Spec Steward
    role: owns spec and issue traceability
    scope: design, specs, issue tracking, validation policy
  - id: session-historian
    name: Session Historian
    role: tracks session lineage and provenance
    scope: parent session, tool usage, validation, child commit references
  - id: intent-diagnostician
    name: Intent Diagnostician
    role: reconstructs the original intent behind a session or regression
    scope: root cause, design drift, scope compliance
  - id: contract-guardian
    name: Contract Guardian
    role: enforces domain boundaries and contract surfaces
    scope: domain ownership, interface and API boundaries
  - id: test-oracle
    name: Test Oracle
    role: runs deterministic validation and bisect analysis
    scope: tests, session verification, regression analysis
  - id: drift-auditor
    name: Drift Auditor
    role: detects mismatch between spec and implementation
    scope: design drift, stale assumptions, issue routing
  - id: abstraction-evaluator
    name: Abstraction Evaluator
    role: reviews whether the system abstraction still fits the project goal
    scope: git substrate, session model, provider abstraction, language suitability
