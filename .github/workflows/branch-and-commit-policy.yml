name: Branch and commit policy

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch naming
        run: python .github/workflows/scripts/branch_policy_check.py

      - name: Validate commit message format
        run: python .github/workflows/scripts/commit_policy_check.py

      - name: Validate PR issue linkage
        run: python .github/workflows/scripts/pr_issue_link_check.py
