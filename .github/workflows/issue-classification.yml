name: Issue classification

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label issue by origin and repo taxonomy
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ''}`.toLowerCase();
            const labels = new Set(issue.labels.map(label => label.name));
            const aiGenerated = /ai[- ]generated|generated by ai|copilot|claude|gpt|agentic|openai|anthropic/i.test(text) || issue.user.type === 'Bot';
            const origin = aiGenerated ? 'ai' : 'human';
            const area = /spec|architecture|agent|contract|session|history|git|bisect|review|design/.test(text) ? 'area:core' :
              /readme|doc|guide|contributing|issue|template/.test(text) ? 'area:docs' :
              /workflow|ci|action|automation|branch|commit|label|policy/.test(text) ? 'area:workflow' :
              /release|version|binary|package|npm|artifact/.test(text) ? 'area:release' :
              'area:spec';
            const type = /research|evaluate|investigate|analysis|explore/.test(text) ? 'type:research' :
              /feature|plugin|distribution|package|add|implement/.test(text) ? 'type:feature' :
              /spec|architecture|design/.test(text) ? 'type:spec' : 'type:task';
            const priority = /urgent|critical|high|priority/.test(text) ? 'priority:high' :
              /medium|normal|moderate/.test(text) ? 'priority:medium' : 'priority:low';
            const status = 'status:planned';

            for (const stale of ['ai', 'human', 'ai-generated', 'human-generated', 'ai-origin', 'human-origin', 'status:planned', 'status:in-progress', 'status:done', 'area:core', 'area:spec', 'area:docs', 'area:workflow', 'area:release', 'priority:low', 'priority:medium', 'priority:high', 'type:feature', 'type:spec', 'type:research', 'type:task']) {
              labels.delete(stale);
            }

            labels.add(origin);
            labels.add(area);
            labels.add(type);
            labels.add(priority);
            labels.add(status);

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [...labels]
            });
