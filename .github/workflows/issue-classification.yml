name: Issue classification

on:
  issues:
    types: [opened, edited, reopened]

jobs:
  classify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label issue by origin
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ''}`.toLowerCase();
            const aiGenerated = /ai[- ]generated|generated by ai|copilot|claude|gpt|agentic/i.test(text) || issue.user.type === 'Bot';
            const labelsToAdd = aiGenerated ? ['ai-generated'] : ['human-generated'];
            const labelsToRemove = aiGenerated ? ['human-generated'] : ['ai-generated'];
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labelsToAdd
            }).catch(() => {});
            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: label
              }).catch(() => {});
            }
