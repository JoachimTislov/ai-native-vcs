name: Spec progress check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the spec list is maintained in the repository
        run: python scripts/check_spec_progress.py
