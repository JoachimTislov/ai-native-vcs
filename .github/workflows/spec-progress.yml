name: Spec progress

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate spec tracker
        run: python scripts/check_spec_progress.py
