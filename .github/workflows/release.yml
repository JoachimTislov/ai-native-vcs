name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example 0.2.0)
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build CLI for ${{ matrix.os }}
        shell: bash
        run: |
          python -m PyInstaller --onefile --name aivcs-cli run_cli.py
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/aivcs-cli.exe dist/aivcs-cli-windows-amd64.exe
            powershell -Command "Compress-Archive -Path 'dist/aivcs-cli-windows-amd64.exe' -DestinationPath 'dist/aivcs-cli-windows-amd64.zip' -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp dist/aivcs-cli dist/aivcs-cli-macos-amd64
            zip -j dist/aivcs-cli-macos-amd64.zip dist/aivcs-cli-macos-amd64
          else
            cp dist/aivcs-cli dist/aivcs-cli-linux-amd64
            zip -j dist/aivcs-cli-linux-amd64.zip dist/aivcs-cli-linux-amd64
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivcs-cli-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Create release tag
        run: |
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: dist-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
