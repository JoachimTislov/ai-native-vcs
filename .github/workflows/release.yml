name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to release (for example 0.2.0)
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Validate tests
        run: python -m pytest tests -q

      - name: Create release tag
        run: bash scripts/release.sh "${{ github.event.inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
